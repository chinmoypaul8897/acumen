# config.yaml -- Acumen Intelligence run configuration (non-secret; committed).
#
# Credentials live in .env and are NEVER printed, logged or committed (CLAUDE.md rule 4).
# Loaded by src/acumen/config.py. Every value below is a SPEC value with its CONTEXT.md
# citation -- changing one requires an architect spec change, never a session decision.
# ASCII-only on purpose (the operator's console is cp1252) -- see src/acumen/config.py.

# INR risk per trade. Sizing is qty = floor(risk_per_trade / (entry - SL)) -- CONTEXT 3.5.
# OPEN-1 RESOLVED: the trader answered Q29 in Round 3 -- risk per trade = 1000 rupees. The
# CONTEXT 9 registry edit + version bump are the architect's (see QUESTIONS.md ROUND-3
# RECEIPTS); this session records the receipt and executes the config value. Position sizing
# is now UNBLOCKED: Config.require_risk_per_trade() returns 1000 instead of raising.
risk_per_trade: 1000  # trader answer, Round 3, 25-Jul-2026

# Flat cost per ROUND-TRIP trade in INR -- CONTEXT 3.5 ("Costs: 100 flat per round-trip
# trade (R1-Q23) subtracted from each trade's PnL"). Charged once per EXECUTED trade; a
# stock-day that produced no executed trade (no cross, or a cross that could not be sized)
# pays nothing, because there is no round trip to charge. Wired here rather than typed into
# the simulator: a money constant hidden in an engine module is invisible to the operator
# and to the architect's spec sync.
cost_per_trade: 100  # CONTEXT 3.5 / R1-Q23

# Volume-profile Row Size N -- CONTEXT 3.3. Row Size = Number of Rows = 24, confirmed by
# trader screenshot (Q32, Round 3): his Fixed Range Volume Profile Rows Layout = "Number of
# Rows", Row Size = 24 (Volume Up/Down is display-only; POC uses total volume, CONTEXT 3.3
# unchanged). OPEN-2's chart-POC reproduction remains chunk 6's gate.
row_size: 24  # confirmed by trader screenshot, Round 3, 25-Jul-2026

# Filesystem placeholders. Relative values are resolved against this file's directory by
# the loader. All three are gitignored (CLAUDE.md: never commit data/, cache/, artifacts).
paths:
  data_dir: data      # Parquet stores (daily + 1-min) -- CONTEXT 6
  cache_dir: cache    # downloaded instrument master / raw API payloads
  logs_dir: logs      # run logs
