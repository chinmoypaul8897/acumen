# config.yaml -- Acumen Intelligence run configuration (non-secret; committed).
#
# Credentials live in .env and are NEVER printed, logged or committed (CLAUDE.md rule 4).
# Loaded by src/acumen/config.py. Every value below is a SPEC value with its CONTEXT.md
# citation -- changing one requires an architect spec change, never a session decision.
# ASCII-only on purpose (the operator's console is cp1252) -- see src/acumen/config.py.

# INR risk per trade. Sizing is qty = floor(risk_per_trade / (entry - SL)) -- CONTEXT 3.5.
# OPEN-1 RESOLVED: the trader answered Q29 in Round 3 -- risk per trade = 1000 rupees. The
# CONTEXT 9 registry edit + version bump are the architect's (see QUESTIONS.md ROUND-3
# RECEIPTS); this session records the receipt and executes the config value. Position sizing
# is now UNBLOCKED: Config.require_risk_per_trade() returns 1000 instead of raising.
risk_per_trade: 1000  # trader answer, Round 3, 25-Jul-2026

# Flat cost per ROUND-TRIP trade in INR -- CONTEXT 3.5 ("Costs: 100 flat per round-trip
# trade (R1-Q23) subtracted from each trade's PnL"). Charged once per EXECUTED trade; a
# stock-day that produced no executed trade (no cross, or a cross that could not be sized)
# pays nothing, because there is no round trip to charge. Wired here rather than typed into
# the simulator: a money constant hidden in an engine module is invisible to the operator
# and to the architect's spec sync.
cost_per_trade: 100  # CONTEXT 3.5 / R1-Q23

# Starting capital in INR -- CONTEXT 3.5 ("Capital: 1,00,000 (R1-Q21a)"). It is the base of
# the equity curve (`capital + cumulative PnL`, Round-3 Q40-d) and the denominator of "return
# on initial capital", of CAGR and of the E13 buy&hold benchmark. It is NOT the Q40-d flag
# figure -- that one is `capital_reference` below and it is the trader's pending Q43 answer.
# Wired here, like its two siblings above, rather than typed into the portfolio module: a
# money constant hidden in an engine module is invisible to the operator and to the
# architect's spec sync (REVIEW_9A finding C1; the module now carries no default at all).
initial_capital: 100000  # CONTEXT 3.5 / R1-Q21a

# Q40-d CAPITAL-INFEASIBILITY FLAGS (CONTEXT 3.5's disclosure list). Both keys are OPTIONAL
# and both are NULL until the trader answers Q43 (which capital figure the flags must use)
# and Q44. While they are null the backtest computes NO flag and every output says
# "capital-infeasibility flags NOT computed -- the trader's Q43 answer is pending". There is
# no default: a flag computed against a guessed figure would mark real trades infeasible on
# this repo's authority rather than his. When the answers arrive: capital_reference is the
# cash figure in INR and margin_basis is the MIS tier as a multiple of it (CONTEXT 3.5's own
# example is 1,00,000 cash vs a 5,00,000 tier, i.e. margin_basis 5). The flags are then
# computed POST-HOC from the ledger -- never inside the run.
capital_reference:   # null -- trader Q43 pending
margin_basis:        # null -- trader Q43 pending

# Volume-profile Row Size N -- CONTEXT 3.3. Row Size = Number of Rows = 24, confirmed by
# trader screenshot (Q32, Round 3): his Fixed Range Volume Profile Rows Layout = "Number of
# Rows", Row Size = 24 (Volume Up/Down is display-only; POC uses total volume, CONTEXT 3.3
# unchanged). OPEN-2's chart-POC reproduction remains chunk 6's gate.
row_size: 24  # confirmed by trader screenshot, Round 3, 25-Jul-2026

# Filesystem roots. Relative values are resolved against this file's directory by the loader.
#
# data_root and cache_root are Q-18 LAYER 1 (CLAUDE.md, "Data-store safety"): the mutable
# stores live OUTSIDE the repository tree, so NO git command can reach them. That is what the
# 31-Jul-2026 incident cost -- `git worktree remove --force` followed two junctions into
# in-repo data/ and cache/ and emptied both. Outside the tree, the same command cannot touch
# them however it is invoked. Both MUST be absolute and outside the repo; the loader refuses
# anything else rather than letting a store drift back inside (src/acumen/config.py).
#
# The operator MOVED the two trees here on 02-Aug-2026; the old in-repo locations are gone.
paths:
  data_root: C:/Users/chinm/acumen-data          # Parquet stores (daily + 1-min), CA cache,
                                                 # adjustment maps, ledgers, run artifacts
  cache_root: C:/Users/chinm/acumen-data/cache   # instrument master / raw API payloads
  logs_dir: logs                                 # run logs (repo-local, gitignored; holds no
                                                 # store data and is regenerated freely)
